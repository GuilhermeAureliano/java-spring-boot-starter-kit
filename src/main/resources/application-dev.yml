spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:starterkit;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy-dev-key}
  flyway:
    enabled: true
    locations: classpath:db/migration
