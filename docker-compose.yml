services:
  postgres:
    image: postgres:16-alpine
    container_name: starterkit-postgres
    environment:
      POSTGRES_DB: starterkit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d starterkit" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: starterkit-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/starterkit
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      APP_SECURITY_USERNAME: admin
      APP_SECURITY_PASSWORD: secret
      OPENAI_API_KEY: dummy-compose-key
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
